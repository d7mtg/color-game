<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="A modern color guessing game - match hex codes to colors!">

    <title>Color Game - Modern Edition</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Match the Hex Code to the Color!</h1>

        <div id="colorCode">#FFFFFF</div>

        <div id="colorsdiv">
            <div class="colorbox"></div>
            <div class="colorbox"></div>
            <div class="colorbox"></div>
        </div>

        <div id="current"></div>

        <div class="stats-container">
            <div id="scorediv">
                <div class="stat-card">
                    <div class="stat-label">Total</div>
                    <div class="stat-value" id="totalcount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Correct</div>
                    <div class="stat-value" id="rightcount">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Wrong</div>
                    <div class="stat-value" id="wrongcount">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0%</div>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="game.js"></script>
</body>
</html>
