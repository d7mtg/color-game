<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F2F2F7">
    <title>Color Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="version">v2.2</div>

    <h1>Color Game</h1>

    <div id="colorCode">#FFFFFF</div>

    <div id="colorsdiv">
        <div class="colorbox">1</div>
        <div class="colorbox">2</div>
        <div class="colorbox">3</div>
    </div>

    <div id="current"></div>

    <div class="stats">
        <div id="score">0%</div>
        <div class="stats-row">
            <span id="totalcount">0 total</span>
            <span id="rightcount">0 right</span>
            <span id="wrongcount">0 wrong</span>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
